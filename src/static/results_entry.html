<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Results</title>
    <style>
        :root {
            --bg: #0f0452;
            --bg-2: #0a1d2e;
            --panel: rgba(15, 23, 42, 0.55);
            --text: #e6f1f7;
            --muted: #8aa6b8;
            --teal: #5cbdb9;
            --ok: #5cd1a3;
            --danger: #ef6b6b;
            --border: rgba(255, 255, 255, 0.12);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-height: 100vh;
            font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 600px at 80% -10%, rgba(92,189,185,.18), transparent 60%),
                radial-gradient(700px 500px at -10% 110%, rgba(45,137,158,.35), transparent 60%),
                var(--bg);
        }
        body { padding: 28px; max-width: 960px; margin: 0 auto; }

        .re-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; color: var(--muted); text-decoration: none; font-size: 13px; }
        .re-back:hover { color: var(--text); }

        .re-header h1 { margin: 0 0 6px; font-size: 24px; font-weight: 700; color: var(--text); font-family: 'Space Grotesk', sans-serif; }
        .re-header p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }

        .re-test-card {
            background: var(--panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px 0 rgba(0,0,0,0.35);
            border-radius: 14px;
            padding: 20px 22px;
            margin-bottom: 20px;
        }
        .re-test-card h3 {
            margin: 0 0 14px;
            color: var(--teal);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        table.re-table { width: 100%; border-collapse: collapse; }
        table.re-table th {
            text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase;
            letter-spacing: 0.05em; padding: 8px 10px; border-bottom: 1px solid var(--border);
        }
        table.re-table td { padding: 10px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text); font-size: 14px; vertical-align: middle; }
        table.re-table tr:last-child td { border-bottom: none; }
        .re-method { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; font-style: italic; }
        .re-unit, .re-range { color: var(--muted); font-size: 13px; white-space: nowrap; }

        table.re-table input {
            width: 100%; padding: 10px 12px; border-radius: 8px;
            border: 1px solid var(--border); background: rgba(0,0,0,0.25);
            color: var(--text); font-size: 14px; font-family: inherit;
            transition: border-color .15s, background .15s;
        }
        table.re-table input:focus {
            outline: none; border-color: var(--teal); background: rgba(0,0,0,0.35);
        }

        .re-empty { color: var(--muted); text-align: center; padding: 30px; font-size: 14px; }

        .re-btn {
            display: inline-flex; align-items: center; gap: 6px;
            border: 0; border-radius: 10px; padding: 11px 20px;
            font-weight: 600; font-family: inherit; font-size: 13px; cursor: pointer;
            text-decoration: none; transition: opacity .15s, transform .15s;
        }
        .re-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .re-btn-primary { background: linear-gradient(135deg, var(--teal), #4a9d99); color: #04121d; }
        .re-btn-ghost { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); }

        .re-actions {
            display: flex; justify-content: flex-end; gap: 10px;
            margin-top: 24px; position: sticky; bottom: 0;
            background: linear-gradient(to top, var(--bg) 60%, transparent);
            padding: 20px 0 8px;
        }

        .re-preview-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
        .re-preview-frame { width: 100%; height: 78vh; border: 1px solid var(--border); border-radius: 12px; background: #525659; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.35); }
    </style>
</head>
<body>
    <a href="/" class="re-back">&larr; Back to Dashboard</a>
    <div class="re-header">
        <h1>Enter Results</h1>
        <p id="re-subtitle">Loading…</p>
    </div>
    <div id="re-content"></div>
    <script src="/js/results_entry.js"></script>
</body>
</html>
